name: NexusBio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f cheminformatics_sandbox/requirements.txt ]; then pip install -r cheminformatics_sandbox/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter (Flake8)
        run: |
          flake8 cheminformatics_sandbox/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pytest Suite
        run: |
          pwd
          ls -la
          PYTHONPATH=. pytest

  deploy-azure:
    needs: [test-python]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: nexusbioacr.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Base RDKit Image
        uses: docker/build-push-action@v5
        with:
          context: ./cheminformatics_sandbox
          file: ./cheminformatics_sandbox/Dockerfile.base
          push: true
          tags: nexusbioacr.azurecr.io/nexusbio-sandbox-base:latest

      - name: Build and Push Main FastAPI App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: nexusbioacr.azurecr.io/nexusbio-app:latest

      - name: Generate GitHub Actions Health Report Summary
        run: |
          echo "### NexusBio Pipeline Health Report" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Job | Status | Target / Environment |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Test Suite (`test-python`)** | Passing | Python 3.11 / Pytest / Flake8 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Azure Deployment (`deploy-azure`)** | Healthy | Azure Container Registry (`nexusbioacr`) |" >> $GITHUB_STEP_SUMMARY